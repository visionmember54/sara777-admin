services:
  # 1. FastAPI Backend Service (powered by MongoDB Atlas)
  - type: web
    name: kalyan-api
    env: python
    region: oregon
    plan: free
    rootDir: admin-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: kalyandb
      - key: JWT_SECRET
        generateValue: true # Render will generate a random string
      - key: CORS_ORIGINS
        sync: false # Set in the Render dashboard to the frontend URL(s), comma-separated. Never "*".
      - key: APP_ENV
        value: production
      - key: ADMIN_INITIAL_PASSWORD
        value: admin12345678
      - key: JWT_ALG
        value: HS256
      - key: JWT_TTL_MIN
        value: 480
